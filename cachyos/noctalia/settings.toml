[shell]
font_family = "Adwaita Mono"
lang = "pt-BR"
panel_anchor_bar = "default"
screen_time_enabled = true
show_close_buttons = false

    [shell.animation]
    speed = 0.90000001341104507

    [shell.launcher]
    categories = false
    compact = true
    layout = "simple"

        [shell.launcher.providers.calculator]
        prefix = ""

        [shell.launcher.providers.emoji]
        prefix = ""

    [shell.panel]
    control_center_placement = "floating"
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    confirm_region = true
    directory = "/home/alsgy/Pictures/Screenshots"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    label = "Suspender"
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot_uefi"
    command = "notify-send 'Noctalia' 'Custom session entry'"
    countdown_seconds = 0.0
    enabled = true
    label = "UEFI"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

