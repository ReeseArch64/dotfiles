[tools]
awscli = { version = "latest", symlink_bins = true }
gcloud = { version = "latest" }
railway = { version = "latest" }
firebase = { version = "latest" }
azure-cli = { version = "latest" }
gh = { version = "latest" }
glab = { version = "latest" }
heroku = { version = "latest" }
"github:render-oss/cli" = { version = "latest", rename_exe = "render" }
"github:getsentry/cli" = { version = "latest", asset_pattern = 'sentry-linux-{{ arch(x64="x64", arm64="arm64") }}', format = "raw", bin = "sentry" }
"github:schpet/linear-cli" = { version = "latest", asset_pattern = 'linear-{{ arch(x64="x86_64", arm64="aarch64") }}-unknown-linux-gnu.tar.xz' }
k9s = { version = "latest" }
kind = { version = "latest" }
kubectl = { version = "latest" }

java = ["temurin-21", "temurin-17", "temurin-11", "temurin-8"]
gradle = { version = "latest" }
maven = { version = "latest" }

flutter = { version = "latest" }

node = { version = "latest" }
"npm:cf" = { version = "latest" }
"npm:vercel" = { version = "latest" }
"npm:neon" = { version = "latest" }
wrangler = { version = "latest" }
bun = { version = "latest" }
pnpm = { version = "latest" }

ruby = { version = "latest" }
php = { version = "latest" }

python = { version = "latest" }
uv = { version = "latest" }

go = { version = "latest" }
